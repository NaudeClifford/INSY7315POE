name: Deploy CB Photography Webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-deploy:
    name: Build and Deploy Frontend to Azure
    runs-on: ubuntu-latest
    environment: DBPhotograph_WebApp_Env

    defaults:
      run:
        working-directory: CB Photography Webapp

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'CB Photography Webapp/package-lock.json'

      # 3. Confirm the build environment
      - name: Check Node.js Environment
        run: |
          node --version
          npm --version
          node -p "'Platform: ' + process.platform + ', Architecture: ' + process.arch"

      # 4. Install dependencies for the Linux runner
      - name: Install Frontend Dependencies
        run: npm ci --include=optional

      # 5. Build Next.js static website
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://dbphotograph-webapp-agh6b6hcdsf4fyaa.southafricanorth-01.azurewebsites.net

      # 6. Deploy frontend to Azure Static Web App
      - name: Deploy Frontend to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_CLI_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'CB Photography Webapp'
          output_location: 'out'

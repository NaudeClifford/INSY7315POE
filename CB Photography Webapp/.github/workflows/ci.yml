name: CB Photography Webapp CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Next.js & ESLint Code Quality Checks
        run: npm run lint

      - name: Validate TypeScript Compilation & Build Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Pass demo or mock variables so build compiles cleanly in CI
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cb-photography-webapp"

      - name: Confirm Build Artifacts
        run: |
          echo "Build completed successfully."
          test -d .next || (echo ".next directory not found!" && exit 1)
